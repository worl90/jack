<!DOCTYPE html>
<html lang="ko">
<head>

    <script src="//t1.kakaocdn.net/kakao_js_sdk/2.1.0/kakao.min.js"></script>

    <style>
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Malgun Gothic', '맑은 고딕', sans-serif; }

        .control_group { position: absolute; display: flex; overflow: hidden; pointer-events: auto; }
        .control_group span { display: block; width: auto; padding: 0 12px; height: 32px; line-height: 32px; text-align: center; font-size: 13px; cursor: pointer; }

        #roadviewControl { position: absolute; bottom: 20px; left: 320px; width: 65px; height: 25px; padding: 2px; z-index: 2; background: #f7f7f7; border-radius: 4px; border: 1px solid #c8c8c8; cursor: pointer; }
        #roadviewControl span { background: url(https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/mapworker.png) no-repeat; padding-left: 23px; height: 24px; font-size: 12px; display: inline-block; line-height: 2; font-weight: bold; color: #333; }
        #roadviewControl.active { background: #ccc; border: 1px solid #7F818A; }
        #roadviewControl.active span { background: url(https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/mapworker_on.png) no-repeat; color: #4C4E57; }

        /* 수정모드 및 관리자 버튼 */
        #editModeBtn {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 10;
            background: #fff; border: 2px solid #dc3545; color: #dc3545; padding: 8px 22px;
            font-size: 13px; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: 0.3s;
            white-space: nowrap;

        #editModeBtn.active { background: #dc3545; color: #fff; border-color: #fff; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); } 100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); } }

        #adminSubBtns {

        /* 우측 패널 */
        #menu_wrap { 
            position: absolute; top: 15px; right: 15px; bottom: 80px; width: 320px; 
            padding: 12px; background: rgba(255, 255, 255, 0.96); z-index: 10; border-radius: 8px;

        #filter_wrap { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid #ddd; margin-bottom: 8px; }

        .manager-bar { display: flex; gap: 4px; margin-bottom: 8px; align-items: center; }
        .manager-bar input { flex: 1; padding: 5px 8px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; }
        .manager-bar button { padding: 5px 8px; font-size: 11px; border: none; border-radius: 4px; cursor: pointer; background: #0d6efd; color: #fff; white-space: nowrap; }

        .batch-action-bar { display: flex; justify-content: space-between; align-items: center; background: #eef2f7; padding: 6px 8px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; }
        .batch-action-bar button { background: #198754; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; }

        .list-item { display: flex; align-items: center; gap: 5px; padding: 6px 4px; border-bottom: 1px solid #eee; font-size: 12px; }
        .list-item:hover { background: #f0f8ff; }
        .list-item-title { flex: 1; cursor: pointer; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
        .list-item-team { font-size: 11px; color: #fff; background: #6c757d; padding: 1px 4px; border-radius: 3px; }
        .list-item-mgr { font-size: 11px; color: #0d6efd; background: #e7f1ff; padding: 1px 5px; border-radius: 3px; }

        .showlistbox { width: 260px; padding: 10px; font-size: 12px; line-height: 1.5; box-sizing: border-box; text-align: left; }
        .showlistbox b { font-size: 14px; color: #333; display: inline-block; margin-bottom: 4px; }
        .label { margin-bottom: 96px; display: flex; font-size: 12px; background: rgba(255,255,255,0.9); padding: 2px 8px; border-radius: 12px; border: 1px solid #ccc; font-weight: bold; }

        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 999; background: rgba(0,0,0,0.85); color: white; padding: 15px 30px; border-radius: 8px; font-weight: bold; text-align:center; line-height:1.5;}

        /* 모바일 반응형 */
        @media screen and (max-width: 768px) {
            .pc-only-btn { display: none !important; }
            #editModeBtn { top: 10px; font-size: 12px; padding: 6px 16px; }

            .sub-admin-btn { font-size: 11px; padding: 5px 12px; }
            
            #container.view_roadview #mapWrapper { width: 100%; height: 50%; }
            #rvWrapper { width: 100%; height: 50%; top: 50%; left: 0; right: auto; }

            .control_group { position: static; left: auto; right: auto; bottom: auto; flex-shrink: 0; }
            .control_group span { font-size: 12px; padding: 0 8px; height: 28px; line-height: 28px; white-space: nowrap; }
            #roadviewControl { bottom: 80px; left: auto; right: 10px; width: auto; height: 32px; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
            #roadviewControl span { background-position: left center; }
            #menu_wrap { top: auto; bottom: 80px; left: 10px; right: 10px; width: auto; height: 240px; }
            #menu_rule { top: 10px; left: 10px; }

<body>

<div id="loading">소화전 데이터를<br>불러오는 중입니다...</div>

<div id="container">
    <div id="rvWrapper">
        <div id="roadview" style="width:100%;height:100%;"></div>
        <div id="close" title="로드뷰닫기" onclick="closeRoadview()"><span class="img"></span></div>
    </div>
    <div id="mapWrapper">
        <div id="map" style="width:100%;height:100%"></div>
        <div id="roadviewControl" onclick="setRoadviewRoad()"><span>로드뷰</span></div>
    </div>
    
    <div id="editModeBtn" onclick="toggleEditMode()">수정모드 켜기</div>
    <div id="adminSubBtns">
        <button id="addMarkerBtn" class="sub-admin-btn" onclick="enableAddMode()">➕ 새 소화전 추가</button>
        <button id="downloadCsvBtn" class="sub-admin-btn pc-only-btn" onclick="downloadCSV()">📥 현재목록 CSV 다운로드</button>
        <button id="uploadCsvBtn" class="sub-admin-btn pc-only-btn" onclick="document.getElementById('csvFileInput').click()">📤 CSV 일괄 업로드</button>
        <input type="file" id="csvFileInput" accept=".csv" style="display:none;" onchange="handleCSVUpload(event)">
    </div>

    <div id="menu_wrap">
        <div class="manager-bar">
            <input type="text" id="mgrSearchInput" placeholder="명칭(예: 216호) 또는 담당자/팀 검색" onkeyup="if(event.key==='Enter') searchKeyword()">
            <button onclick="searchKeyword()">검색</button>
            <button onclick="clearSearch()" style="background:#6c757d;">취소</button>
        </div>

        <div style="font-size:11px; color:#555; margin-bottom:3px; font-weight:bold;">팀별 분류:</div>
        <div id="team_filter_wrap">
            <button onclick="filterByTeam('전체')" style="background:#495057; color:#fff; font-weight:bold; border:none;">전체팀</button>
        </div>

        <div style="font-size:11px; color:#555; margin-bottom:3px; font-weight:bold;">지역별 분류:</div>
        <div id="filter_wrap">
            <button onclick="filterHydrants('전체')" style="background:#0d6efd; color:#fff; font-weight:bold; border:none;">전체</button>
        </div>

        <div class="batch-action-bar">
            <label><input type="checkbox" id="selectAllChk" onchange="toggleSelectAll(this.checked)"> 전체</label>
            <button onclick="assignTeamAndManagerToChecked()">팀/담당자 일괄지정</button>
            <button onclick="openCurrentListInNewWindow()" style="background:#0dcaf0; color:#000;">🔗 새창</button>
        </div>

        <div id="list_items_container"></div>
    </div>
</div>

<div class="mobile_controls_wrapper">
    <div class="control_group radius_border ct_map">
        <span id="btnRoadmap" class="selected_btn" onclick="setMapType('roadmap')">지도</span>
        <span id="btnSkyview" class="btn" onclick="setMapType('skyview')">스카이뷰</span>
    </div>
    <div class="control_group radius_border ct_ground">
        <span id="btnGround" class="btn" onclick="setOverlayMapTypeId(true)">지적편집도</span>
        <span id="btnGroundHide" class="selected_btn" onclick="setOverlayMapTypeId(false)">숨기기</span>
    </div>
    <div class="control_group radius_border ct_me">
        <span id="btnCurrentMe" class="btn" onclick="mapCurrentPosition2()">내위치</span>
        <span id="btnCurrentHideMe" class="selected_btn" onclick="mapCurrentPositionHide()">숨기기</span>
    </div>
    <div class="control_group radius_border ct_list">
        <span id="btnTitleList" class="selected_btn" onclick="toggleShowList(true)">목록</span>
        <span id="btnTitleListHide" class="btn" onclick="toggleShowList(false)">숨기기</span>
    </div>
</div>

<div id="menu_rule">   
    <button id='btnMARKER' onclick="rule_line()">거리</button>
    <button id='btnPOLYLINE' onclick="rule_poly()">면적</button>
    <button id='btnARROW' onclick="rule_circle()">반경</button>    
    <button class="berror" onclick="RulerRemove()">초기화</button>
</div>

<script>
Kakao.init('8716aeaad27b0f020a25063da87bd5de'); 

var CLOUDFLARE_API_URL = "https://hydrant-api.90rlaworl.workers.dev/hydrants";

var Navi_Imgsrc = "";
var is_mobile = false;
var UserAgent = navigator.userAgent;
if (UserAgent.match(/iPhone|iPod|iPad|Android|Windows CE|BlackBerry|Symbian|Windows Phone|webOS|Opera Mini|Opera Mobi|POLARIS|IEMobile|lgtelecom|nokia|SonyEricsson/i) || UserAgent.match(/LG|SAMSUNG|Samsung/)) {
    is_mobile = true;
    Navi_Imgsrc = "<img src='https://blog.kakaocdn.net/dn/n32AT/btspnjHn5oH/roFNyJ3MjERPumDVr33sF1/navi.png?attach=1&knm=img.png' width='40' style='margin-bottom:5px;'><br>";
}

var mapContainer = document.getElementById('map');
var mapCenter = new kakao.maps.LatLng(34.76014841, 127.661568); 
var mapOption = { center: mapCenter, level: 5 };
var map = new kakao.maps.Map(mapContainer, mapOption);

var clusterer = new kakao.maps.MarkerClusterer({
    map: map, averageCenter: true, minLevel: 6, disableClickZoom: false
});

var rvContainer = document.getElementById('roadview');
var rv = new kakao.maps.Roadview(rvContainer); 
var rvClient = new kakao.maps.RoadviewClient(); 
var zoomControl = new kakao.maps.ZoomControl(); 
map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

var markers = [], customOverlays = [], infowindows = [];
var myMarker = null;
var hydrantData = [];  
var isEditMode = false;
var zAddMode = false;
var currentFilter = '전체'; 
var currentTeamFilter = '전체';
var currentSearchKeyword = '';

var REGION_ORDER = ["학동", "연등", "여서", "봉산", "돌산", "평여", "소라", "정대", "화학"];

var CENTER_LOCATIONS = {
    '전체': { lat: 34.76014841, lng: 127.661568, level: 6 },
    '학동': { lat: 34.76189, lng: 127.66195, level: 4 },
    '연등': { lat: 34.74256, lng: 127.72967, level: 4 },
    '여서': { lat: 34.75782, lng: 127.70295, level: 4 },
    '봉산': { lat: 34.73024, lng: 127.73012, level: 4 },
    '돌산': { lat: 34.72140, lng: 127.75219, level: 5 },
    '평여': { lat: 34.80964, lng: 127.66943, level: 4 },
    '소라': { lat: 34.84298, lng: 127.63318, level: 5 },
    '정대': { lat: 34.75382, lng: 127.74712, level: 4 },
    '화학': { lat: 34.84972, lng: 127.69751, level: 4 }
};

// ★ [최적화 1] 마커 이미지 객체 전역 메모리 캐시 (수천 개 중복 생성 차단)
var markerImageCacheNormal = {};
var markerImageCacheDraggable = {};
var imageSize = new kakao.maps.Size(25, 28);
var imageOption = { offset: new kakao.maps.Point(12, 28) };

// ★ [최적화 2] 이미지 URL 함수 (jsDelivr CDN 우선 연결, 실패 시 GitHub Pages 자동 대비)
function getMarkerImageUrl(imgName) {
    // jsDelivr 글로벌 엣지 CDN을 통해 국내 초고속 로딩 보장
    return "https://cdn.jsdelivr.net/gh/worl90/jack@main/" + imgName + ".png";
}

function getHydrantMarkerImage(imgName) {
    var name = imgName ? imgName : "fs1";
    if (!markerImageCacheNormal[name]) {
        var src = getMarkerImageUrl(name);
        markerImageCacheNormal[name] = new kakao.maps.MarkerImage(src, imageSize, imageOption);
    }
    return markerImageCacheNormal[name];
}

// 10종 마커 이미지 사전 프리로딩 (지도가 켜지자마자 브라우저 메모리에 즉시 적재)
function preloadMarkerImages() {
    for (var i = 1; i <= 10; i++) {
        var imgKey = "fs" + i;
        var preloadImg = new Image();
        preloadImg.src = getMarkerImageUrl(imgKey);
        // 캐시 객체 미리 생성
        getHydrantMarkerImage(imgKey);
    }
}
preloadMarkerImages();

function getRegionName(title) {
    if (!title) return "";
    var parts = title.split('-');
    if (parts.length >= 3) {
        return parts[2].trim();
    }
    return "";
}

function getHydrantNumber(title) {
    if (!title) return 999999;
    var match = title.match(/(\d+)호?$/);
    return match ? parseInt(match[1], 10) : 999999;
}

function compareHydrants(a, b) {
    var regA = getRegionName(a.title);
    var regB = getRegionName(b.title);

    var idxA = REGION_ORDER.indexOf(regA);
    var idxB = REGION_ORDER.indexOf(regB);

    if (idxA === -1) idxA = 999;
    if (idxB === -1) idxB = 999;

    if (idxA !== idxB) {
        return idxA - idxB;
    }

    if (idxA === 999 && regA !== regB) {
        return regA.localeCompare(regB, 'ko');
    }

    var numA = getHydrantNumber(a.title);
    var numB = getHydrantNumber(b.title);
    if (numA !== numB) {
        return numA - numB;
    }

    return (a.title || "").localeCompare(b.title || "", 'ko');
}

function loadData() {
    var loadingEl = document.getElementById('loading');
    if (loadingEl) loadingEl.style.display = 'block';
    
    fetch(CLOUDFLARE_API_URL)
        .then(response => {
            if (!response.ok) throw new Error('API 응답 에러 (코드: ' + response.status + ')');
            return response.json();
        })
        .then(data => {
            if (loadingEl) loadingEl.style.display = 'none';
            hydrantData = Array.isArray(data) ? data : [];
            hydrantData.sort(compareHydrants);

            try {
                generateTeamButtons();
                generateFilterButtons();
                renderMapAndList();
            } catch (err) {
                console.error("렌더링 오류:", err);
            }
        })
        .catch(error => {
            if (loadingEl) {
                loadingEl.innerHTML = "데이터 로드 실패!<br><span style='font-size:12px;font-weight:normal;'>" + error.message + "</span><br><button onclick='location.reload()' style='margin-top:10px;padding:4px 8px;'>새로고침</button>";
            }
            console.error('Error:', error);
        });
}

function generateTeamButtons() {
    var teams = new Set();
    hydrantData.forEach(item => {
        if (item && item.team && item.team.trim() !== "") {
            teams.add(item.team.trim());
        }
    });

    var wrap = document.getElementById('team_filter_wrap');
    wrap.innerHTML = `<button onclick="filterByTeam('전체')" style="${currentTeamFilter==='전체'?'background:#495057; color:#fff; font-weight:bold; border:none;':'background:#f8f9fa; color:#333; border:1px solid #adb5bd;'}">전체팀</button>`;

    Array.from(teams).sort().forEach(t => {
        var isSelected = (currentTeamFilter === t);
        var btnBg = isSelected ? "background:#495057; color:#fff; font-weight:bold; border:none;" : "background:#f8f9fa; color:#333; border:1px solid #adb5bd;";
        var btn = document.createElement('button');
        btn.innerText = t;
        btn.setAttribute('onclick', `filterByTeam('${t}')`);
        btn.style.cssText = btnBg;
        wrap.appendChild(btn);
    });
}

function filterByTeam(teamName) {
    currentTeamFilter = teamName;
    var buttons = document.querySelectorAll('#team_filter_wrap button');
    buttons.forEach(btn => {
        if (btn.innerText === (teamName === '전체' ? '전체팀' : teamName)) {
            btn.style.background = "#495057";
            btn.style.color = "#fff";
            btn.style.border = "none";
            btn.style.fontWeight = "bold";
        } else {
            btn.style.background = "#f8f9fa";
            btn.style.color = "#333";
            btn.style.border = "1px solid #adb5bd";
            btn.style.fontWeight = "normal";
        }
    });
    renderMapAndList();
}

function generateFilterButtons() {
    var foundRegions = new Set();
    hydrantData.forEach(item => {
        if (item && item.title) {
            var reg = getRegionName(item.title);
            if (reg) foundRegions.add(reg);
        }
    });

    var sortedRegions = [];
    REGION_ORDER.forEach(r => {
        if (foundRegions.has(r)) {
            sortedRegions.push(r);
            foundRegions.delete(r);
        }
    });
    Array.from(foundRegions).sort().forEach(r => sortedRegions.push(r));

    var filterWrap = document.getElementById('filter_wrap');
    filterWrap.innerHTML = `<button onclick="filterHydrants('전체')" style="${currentFilter==='전체'?'background:#0d6efd; color:#fff; font-weight:bold; border:none;':'background:#f8f9fa; color:#333; border:1px solid #ccc;'}">전체</button>`;

    sortedRegions.forEach(region => {
        var isSelected = (currentFilter === region);
        var btnBg = isSelected ? "background:#0d6efd; color:#fff; font-weight:bold; border:none;" : "background:#f8f9fa; color:#333; border:1px solid #ccc;";
        
        var btn = document.createElement('button');
        btn.innerText = region;

            item.team = newTeam;

function downloadCSV() {
    if (!hydrantData || hydrantData.length === 0) {
        alert("다운로드할 소화전 데이터가 없습니다.");
        return;
    }

    var targetList = hydrantData.filter(item => {
        if (!item || !item.title) return false;
        var matchRegion = (currentFilter === '전체' || item.title.includes(currentFilter));
        var matchTeam = (currentTeamFilter === '전체' || item.team === currentTeamFilter);
        
        var matchKeyword = true;
        if (currentSearchKeyword) {
            var kw = currentSearchKeyword.toLowerCase();
            var titleMatch = (item.title && item.title.toLowerCase().includes(kw));
            var managerMatch = (item.manager && item.manager.toLowerCase().includes(kw));
            var teamMatch = (item.team && item.team.toLowerCase().includes(kw));
            var descMatch = (item.desc && item.desc.toLowerCase().includes(kw));
            matchKeyword = (titleMatch || managerMatch || teamMatch || descMatch);
        }
        
        return matchRegion && matchTeam && matchKeyword;
    });

    if (targetList.length === 0) {
        alert("현재 선택된 조건에 해당하는 소화전이 없습니다.");
        return;
    }

    targetList.sort(compareHydrants);

    var headers = ["id", "title", "lat", "lng", "desc", "detail", "img", "team", "manager"];
    var csvRows = [];
    csvRows.push(headers.join(","));

    targetList.forEach(function(item) {
        var row = [
            item.id,
            `"${(item.title || "").replace(/"/g, '""')}"`,
            item.lat,
            item.lng,
            `"${(item.desc || "").replace(/"/g, '""')}"`,
            `"${((item.detail && item.detail !== 'NULL') ? item.detail : "").replace(/"/g, '""')}"`,
            `"${(item.img || "fs1").replace(/"/g, '""')}"`,
            `"${(item.team || "").replace(/"/g, '""')}"`,
            `"${(item.manager || "").replace(/"/g, '""')}"`
        ];
        csvRows.push(row.join(","));
    });

    var csvString = "\uFEFF" + csvRows.join("\r\n");
    var blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
    var link = document.createElement("a");
    var url = URL.createObjectURL(blob);
    
    var today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
    var filterName = "";
    if (currentFilter !== '전체') filterName += `_${currentFilter}`;
    if (currentTeamFilter !== '전체') filterName += `_${currentTeamFilter}`;
    if (currentSearchKeyword) filterName += `_${currentSearchKeyword}`;
    if (!filterName) filterName = "_전체";

    link.setAttribute("href", url);
    link.setAttribute("download", `소화전${filterName}_${today}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

function parseCSVText(text) {
    var lines = text.split(/\r\n|\n|\r/).filter(line => line.trim() !== "");
    if (lines.length < 2) return [];

    function parseLine(line) {
        var result = [];
        var cur = "";
        var inQuotes = false;
        for (var i = 0; i < line.length; i++) {
            var c = line[i];
            if (c === '"') {
                if (inQuotes && line[i + 1] === '"') {
                    cur += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (c === ',' && !inQuotes) {
                result.push(cur.trim());
                cur = "";
            } else {
                cur += c;
            }
        }
        result.push(cur.trim());
        return result;
    }

    var headers = parseLine(lines[0]).map(h => h.toLowerCase().replace(/['"]/g, ''));
    var items = [];

    for (var i = 1; i < lines.length; i++) {
        var cols = parseLine(lines[i]);
        if (cols.length === 0 || (cols.length === 1 && cols[0] === "")) continue;

        var obj = {};
        headers.forEach((h, idx) => {
            obj[h] = cols[idx] !== undefined ? cols[idx] : "";
        });

        if (obj.id && obj.title && obj.lat && obj.lng) {
            items.push({
                id: parseInt(obj.id),
                title: obj.title,
                lat: parseFloat(obj.lat),
                lng: parseFloat(obj.lng),
                desc: obj.desc || "",
                detail: obj.detail || "",
                img: obj.img || "fs1",
                team: obj.team || "",
                manager: obj.manager || ""
            });
        }
    }
    return items;
}

function handleCSVUpload(event) {
    var file = event.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(e) {
        try {
            var text = e.target.result;
            var parsedItems = parseCSVText(text);

            if (parsedItems.length === 0) {
                alert("CSV 파일에 유효한 데이터가 없거나 헤더 규격이 맞지 않습니다.");
                event.target.value = "";
                return;
            }

            var idSet = new Set();
            var titleSet = new Set();
            var dupErrors = [];

            for (var i = 0; i < parsedItems.length; i++) {
                var itm = parsedItems[i];
                if (idSet.has(itm.id)) {
                    dupErrors.push(`ID 중복: ${itm.id}번 (명칭: ${itm.title})`);
                }
                if (titleSet.has(itm.title)) {
                    dupErrors.push(`소화전 명칭 중복: [${itm.title}]`);
                }
                idSet.add(itm.id);
                titleSet.add(itm.title);

                if (dupErrors.length >= 3) break;
            }

            if (dupErrors.length > 0) {
                alert("⚠️ 파일 내에 중복된 데이터가 발견되어 업로드가 취소되었습니다!\n\n" + dupErrors.join("\n") + "\n\n엑셀에서 중복을 확인 및 수정 후 다시 업로드해주세요.");
                event.target.value = "";
                return;
            }

            if (!confirm(`총 ${parsedItems.length}개의 소화전 데이터를 클라우드에 일괄 등록/수정하시겠습니까?`)) {
                event.target.value = "";
                return;
            }

            var loadingLayer = document.getElementById('loading');
            loadingLayer.innerHTML = `총 ${parsedItems.length}건 데이터 일괄 반영 중...`;
            loadingLayer.style.display = 'block';

            fetch(`${CLOUDFLARE_API_URL}/batch-upsert`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ items: parsedItems })
            })
            .then(res => res.json())
            .then(result => {
                loadingLayer.style.display = 'none';
                event.target.value = "";
                if (result.success) {
                    alert(`성공적으로 ${result.count}건의 소화전 데이터가 반영되었습니다!`);
                    loadData();
                } else {
                    alert("일괄 업로드 실패: " + result.error);
                }
            })
            .catch(err => {
                loadingLayer.style.display = 'none';
                event.target.value = "";
                alert("통신 중 오류가 발생했습니다.");
            });

        } catch (err) {
            alert("CSV 파싱 오류: " + err.message);
            event.target.value = "";
        }
    };

    reader.readAsText(file, "utf-8");
}

kakao.maps.event.addListener(map, 'click', function(mouseEvent) {

function insertNewHydrant(title, lat, lng, desc, detail, img, team, manager) {
    var loadingLayer = document.getElementById('loading');
    loadingLayer.innerHTML = "새 소화전을 클라우드에 등록 중...";
    loadingLayer.style.display = 'block';

    fetch(CLOUDFLARE_API_URL, {
        method: 'POST',
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, lat, lng, desc, detail, img, team, manager })
    })
    .then(res => res.json())
    .then(result => {
        loadingLayer.style.display = 'none';
        if(result.success) {
            alert(`소화전 #${result.id}번이 등록되었습니다.`);
            loadData(); 
        } else {
            alert("등록 실패: " + result.error);
        }
    })
    .catch(err => {
        loadingLayer.style.display = 'none';
        alert("통신 오류 발생");
    });
}

function updateLocationDirectly(id, lat, lng, markerObj, originalPos, overlayObj) {
    var loadingLayer = document.getElementById('loading');
    loadingLayer.innerHTML = "클라우드에 위치 저장 중...";
    loadingLayer.style.display = 'block';

    fetch(`${CLOUDFLARE_API_URL}/${id}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ lat: lat, lng: lng })
    })
    .then(res => res.json())
    .then(result => {
        loadingLayer.style.display = 'none';
        if(result.success) {
            alert("위치가 클라우드에 저장되었습니다.");
            overlayObj.setPosition(new kakao.maps.LatLng(lat, lng)); 
            var item = hydrantData.find(h => h.id == id);
            if (item) { item.lat = lat; item.lng = lng; }
        } else {
            alert("저장 실패: " + result.error);
            markerObj.setPosition(originalPos);
        }
    })
    .catch(err => {
        loadingLayer.style.display = 'none';
        alert("통신 오류로 인해 원위치됩니다.");
        markerObj.setPosition(originalPos);
    });
}

var overlayOn = false;
var rvMarkImage = new kakao.maps.MarkerImage('https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/roadview_wk.png', new kakao.maps.Size(35,39), { offset: new kakao.maps.Point(14, 39) });
var rvMarker = new kakao.maps.Marker({ image : rvMarkImage, position: mapCenter, draggable: true });

var drawingFlagCir = false, centerPosition, drawingCircle, drawingLineC, drawingOverlay;
var circles = [], clickLine, moveLine, drawingFlagLine = false, distanceOverlay, dots = [];
var drawingFlagPoly = false, drawingPolygon, polygon, areaOverlay;
var clickHandlerRule, mousemoveHandlerRule, rightclickHandlerRule;

function setRuleClear() { kakao.maps.event.removeListener(map, 'click', clickHandlerRule); kakao.maps.event.removeListener(map, 'mousemove', mousemoveHandlerRule); kakao.maps.event.removeListener(map, 'rightclick', rightclickHandlerRule); }
function rule_circle() {
    setRuleClear();
    clickHandlerRule = function(mouseEvent) {   
        if (!drawingFlagCir) { removeCircles(); drawingFlagCir = true; centerPosition = mouseEvent.latLng; 
            if (!drawingLineC) { drawingLineC = new kakao.maps.Polyline({ strokeWeight: 3, strokeColor: '#00a0e9', strokeOpacity: 1, strokeStyle: 'solid' });  }
            if (!drawingCircle) { drawingCircle = new kakao.maps.Circle({ strokeWeight: 1, strokeColor: '#00a0e9', strokeOpacity: 0.1, strokeStyle: 'solid', fillColor: '#00a0e9', fillOpacity: 0.2 }); }
            if (!drawingOverlay) { drawingOverlay = new kakao.maps.CustomOverlay({ xAnchor: 0, yAnchor: 0, zIndex: 1 }); } }
    };
    kakao.maps.event.addListener(map, 'click', clickHandlerRule);
    mousemoveHandlerRule = function (mouseEvent) {
        if (drawingFlagCir) { var mousePosition = mouseEvent.latLng; var linePath = [centerPosition, mousePosition]; drawingLineC.setPath(linePath); var length = drawingLineC.getLength();
            if(length > 0) { drawingCircle.setOptions({ center : centerPosition, radius: length }); var radius = Math.round(drawingCircle.getRadius()); var content = '<div class="info">반경 <span class="number">' + radius + '</span>m</div>'; drawingOverlay.setPosition(mousePosition); drawingOverlay.setContent(content); drawingCircle.setMap(map); drawingLineC.setMap(map); drawingOverlay.setMap(map);
            } else { drawingCircle.setMap(null); drawingLineC.setMap(null); drawingOverlay.setMap(null); } }      
    };
    kakao.maps.event.addListener(map, 'mousemove', mousemoveHandlerRule);
    rightclickHandlerRule = function(mouseEvent) {    
        if (drawingFlagCir) { var rClickPosition = mouseEvent.latLng; var polyline = new kakao.maps.Polyline({ path: [centerPosition, rClickPosition], strokeWeight: 3, strokeColor: '#00a0e9', strokeOpacity: 1, strokeStyle: 'solid' }); var circle = new kakao.maps.Circle({ center : centerPosition, radius: polyline.getLength(), strokeWeight: 1, strokeColor: '#00a0e9', strokeOpacity: 0.1, strokeStyle: 'solid', fillColor: '#00a0e9', fillOpacity: 0.2 }); var radius = Math.round(circle.getRadius()); var content = getTimeHTML_C(radius); var radiusOverlay = new kakao.maps.CustomOverlay({ content: content, position: rClickPosition, xAnchor: 0, yAnchor: 0, zIndex: 1 });  circle.setMap(map); polyline.setMap(map); radiusOverlay.setMap(map); circles.push({ 'polyline' : polyline, 'circle' : circle, 'overlay' : radiusOverlay }); drawingFlagCir = false; centerPosition = null; drawingCircle.setMap(null); drawingLineC.setMap(null); drawingOverlay.setMap(null); }
    };   
    kakao.maps.event.addListener(map, 'rightclick', rightclickHandlerRule);
}
function removeCircles() { for (var i = 0; i < circles.length; i++) { circles[i].circle.setMap(null); circles[i].polyline.setMap(null); circles[i].overlay.setMap(null); } circles = []; }
function getTimeHTML_C(distance) { var walkkTime = distance / 67 | 0; var walkHour = '', walkMin = ''; if (walkkTime > 60) walkHour = '<span class="number">' + Math.floor(walkkTime / 60) + '</span>시간 '; walkMin = '<span class="number">' + walkkTime % 60 + '</span>분'; var bycicleTime = distance / 227 | 0; var bycicleHour = '', bycicleMin = ''; if (bycicleTime > 60) bycicleHour = '<span class="number">' + Math.floor(bycicleTime / 60) + '</span>시간 '; bycicleMin = '<span class="number">' + bycicleTime % 60 + '</span>분'; return '<ul class="info"><span>총거리</span><span class="number">' + distance + '</span>m <span >도보</span>' + walkHour + walkMin + ' <span >자전거</span>' + bycicleHour + bycicleMin + '</ul>'; }

function rule_line() {
    setRuleClear();
    clickHandlerRule = function(mouseEvent) {    
        var clickPosition = mouseEvent.latLng;
        if (!drawingFlagLine) { drawingFlagLine = true; deleteClickLine(); deleteDistnce(); deleteCircleDot(); clickLine = new kakao.maps.Polyline({ map: map, path: [clickPosition], strokeWeight: 3, strokeColor: '#db4040', strokeOpacity: 1, strokeStyle: 'solid' }); moveLine = new kakao.maps.Polyline({ strokeWeight: 3, strokeColor: '#db4040', strokeOpacity: 0.5, strokeStyle: 'solid' }); displayCircleDot(clickPosition, 0);
        } else { var path = clickLine.getPath(); path.push(clickPosition); clickLine.setPath(path); var distance = Math.round(clickLine.getLength()); displayCircleDot(clickPosition, distance); }
    };
    kakao.maps.event.addListener(map, 'click', clickHandlerRule);
    mousemoveHandlerRule = function (mouseEvent) {
        if (drawingFlagLine){ var mousePosition = mouseEvent.latLng; var path = clickLine.getPath(); var movepath = [path[path.length-1], mousePosition]; moveLine.setPath(movepath); moveLine.setMap(map); var distance = Math.round(clickLine.getLength() + moveLine.getLength()); var content = '<div class="dotOverlay distanceInfo">총거리 <span class="number">' + distance + '</span>m</div>'; showDistance(content, mousePosition); }              
    };
    kakao.maps.event.addListener(map, 'mousemove', mousemoveHandlerRule);                  
    rightclickHandlerRule = function(mouseEvent) {    
        if (drawingFlagLine) { moveLine.setMap(null); moveLine = null; var path = clickLine.getPath(); if (path.length > 1) { if (dots[dots.length-1].distance) { dots[dots.length-1].distance.setMap(null); dots[dots.length-1].distance = null; } var distance = Math.round(clickLine.getLength()); var content = getTimeHTML_L(distance); showDistance(content, path[path.length-1]); } else { deleteClickLine(); deleteCircleDot(); deleteDistnce(); } drawingFlagLine = false; }  
    };
    kakao.maps.event.addListener(map, 'rightclick', rightclickHandlerRule);
    function deleteClickLine() { if (clickLine) { clickLine.setMap(null); clickLine = null; } }
    function showDistance(content, position) { if (distanceOverlay) { distanceOverlay.setPosition(position); distanceOverlay.setContent(content); } else { distanceOverlay = new kakao.maps.CustomOverlay({ map: map, content: content, position: position, xAnchor: 0, yAnchor: 0, zIndex: 3 }); } }
    function deleteDistnce () { if (distanceOverlay) { distanceOverlay.setMap(null); distanceOverlay = null; } }
    function displayCircleDot(position, distance) { var circleOverlay = new kakao.maps.CustomOverlay({ content: '<span class="dot"></span>', position: position, zIndex: 1 }); circleOverlay.setMap(map); var distanceOverlay = null; if (distance > 0) { distanceOverlay = new kakao.maps.CustomOverlay({ content: '<div class="dotOverlay">거리 <span class="number">' + distance + '</span>m</div>', position: position, yAnchor: 1, zIndex: 2 }); distanceOverlay.setMap(map); } dots.push({circle:circleOverlay, distance: distanceOverlay}); }
    function deleteCircleDot() { for (var i = 0; i < dots.length; i++ ){ if (dots[i].circle) dots[i].circle.setMap(null); if (dots[i].distance) dots[i].distance.setMap(null); } dots = []; }
    function getTimeHTML_L(distance) { var walkkTime = distance / 67 | 0; var walkHour = '', walkMin = ''; if (walkkTime > 60) walkHour = '<span class="number">' + Math.floor(walkkTime / 60) + '</span>시간 '; walkMin = '<span class="number">' + walkkTime % 60 + '</span>분'; var bycicleTime = distance / 227 | 0; var bycicleHour = '', bycicleMin = ''; if (bycicleTime > 60) bycicleHour = '<span class="number">' + Math.floor(bycicleTime / 60) + '</span>시간 '; bycicleMin = '<span class="number">' + bycicleTime % 60 + '</span>분'; return '<ul class="dotOverlay distanceInfo"><span >총거리</span><span class="number">' + distance + '</span>m <span >도보</span>' + walkHour + walkMin + ' <span >자전거</span>' + bycicleHour + bycicleMin + '</ul>'; }
}

function rule_poly() {
    setRuleClear();
    clickHandlerRule = function(mouseEvent) {    
        var clickPosition = mouseEvent.latLng; 
        if (!drawingFlagPoly) { drawingFlagPoly = true; if (polygon) { polygon.setMap(null); polygon = null; } if (areaOverlay) { areaOverlay.setMap(null); areaOverlay = null; } drawingPolygon = new kakao.maps.Polygon({ map: map, path: [clickPosition], strokeWeight: 3, strokeColor: '#00a0e9', strokeOpacity: 1, strokeStyle: 'solid', fillColor: '#00a0e9', fillOpacity: 0.2 }); polygon = new kakao.maps.Polygon({ path: [clickPosition], strokeWeight: 3, strokeColor: '#00a0e9', strokeOpacity: 1, strokeStyle: 'solid', fillColor: '#00a0e9', fillOpacity: 0.2 });
        } else { var drawingPath = drawingPolygon.getPath(); drawingPath.push(clickPosition); drawingPolygon.setPath(drawingPath); var path = polygon.getPath(); path.push(clickPosition); polygon.setPath(path); }   
    }; 
    kakao.maps.event.addListener(map, 'click', clickHandlerRule);
    mousemoveHandlerRule = function (mouseEvent) { if (drawingFlagPoly){ var mousePosition = mouseEvent.latLng; var path = drawingPolygon.getPath(); if (path.length > 1) path.pop(); path.push(mousePosition); drawingPolygon.setPath(path); } };     
    kakao.maps.event.addListener(map, 'mousemove', mousemoveHandlerRule);
    rightclickHandlerRule = function(mouseEvent) {    
        if (drawingFlagPoly) { drawingPolygon.setMap(null); drawingPolygon = null; var path = polygon.getPath(); if (path.length > 2) { polygon.setMap(map); var area = Math.round(polygon.getArea()); var content = '<div class="info">총면적 <span class="number"> ' + area + '</span> m<sup>2</sup></div>'; areaOverlay = new kakao.maps.CustomOverlay({ map: map, content: content, xAnchor: 0, yAnchor: 0, position: path[path.length-1] }); } else { polygon = null; } drawingFlagPoly = false; }  
    };
    kakao.maps.event.addListener(map, 'rightclick', rightclickHandlerRule);
}
function RulerRemove(){
    if (clickLine) { clickLine.setMap(null); clickLine = null; }
    if (distanceOverlay) { distanceOverlay.setMap(null); distanceOverlay = null; }
    for ( var i = 0; i < dots.length; i++ ){ if (dots[i].circle) dots[i].circle.setMap(null); if (dots[i].distance) dots[i].distance.setMap(null); } dots = [];
    if (polygon) { polygon.setMap(null); polygon = null; }
    if (areaOverlay) { areaOverlay.setMap(null); areaOverlay = null; }
    removeCircles();
}
